# Familles de métiers reconnues, par priorité (cahier des charges § 3.1).
#
# La reconnaissance se fait sur le TITRE de l'offre, normalisé (minuscules, sans accents,
# ponctuation remplacée par des espaces) et comparé mot à mot : « ia » ne reconnaît pas
# « media », « ml » ne reconnaît pas « html ». Écrire les motifs sans accents.
#
# Quand un titre relève de plusieurs familles, la priorité la plus haute l'emporte
# (1 avant 2 avant 3), puis l'ordre de ce fichier.
#
# `romes` : codes ROME de France Travail rattachés à la famille, à titre documentaire. Ils
# ne servent pas à classer : France Travail range parfois sous un code data des offres sans
# rapport (essai du 26/10). Les codes interrogés sont dans sources.yaml.

# Titres exclus même s'ils contiennent un motif de famille (décision du 26/10 : métiers trop
# éloignés du cœur de cible).
exclusions:
  - business analyst
  - business analysts
  - business analyste
  - business analystes
  - analyste fonctionnel
  - consultant fonctionnel
  - amoa
  - moa
  # Postes de recherche académique, qui exigent un doctorat (décision du 28/10, cas CESI).
  - enseignant chercheur
  - enseignante chercheuse
  - enseignant e chercheur e
  - maitre de conferences
  - doctorant
  - doctorante
  - post doctorant
  - post doctorante
  - postdoc
  - post doc

