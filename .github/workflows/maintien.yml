name: Maintien des workflows planifiés

# GitHub désactive un workflow planifié après 60 jours sans activité sur le dépôt. Ce
# workflow réactive chaque mois les workflows planifiés par l'API, sans commit factice.

on:
  schedule:
    - cron: '23 4 1 * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  maintien:
    runs-on: ubuntu-latest
    steps:
      - name: Réactive les workflows planifiés
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in veille.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable" && echo "$wf réactivé" || echo "$wf absent"
          done
