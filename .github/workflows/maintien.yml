name: Maintien des workflows planifiés

# GitHub désactive un workflow planifié après 60 jours sans activité sur le dépôt. Ce
# workflow le réactive chaque mois par l'API, sans commit factice.

on:
  schedule:
    - cron: '23 4 1 * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  maintien:
    runs-on: ubuntu-latest
    steps:
      - name: Réactive la veille
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/veille.yml/enable"
