name: Évaluation du tri

# Rejoue les règles actuelles sur l'échantillon annoté (eval/) et les avis de l'onglet
# « Annotation ». Métriques agrégées en annotations (publiques) ; détail offre par offre dans
# un nouvel onglet du fichier de suivi (privé), seulement lors d'un lancement manuel : une
# fusion dans main mesure sans rien écrire. Aucune autre écriture.

on:
  push:
    branches: [main]
    paths: ['config/**', 'src/**', 'eval/**', 'scripts/evaluer_tri.py', '.github/workflows/evaluation.yml']
  workflow_dispatch:

concurrency:
  group: evaluation
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  evaluer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Évaluation
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          SUIVI_SHEET_ID: ${{ secrets.SUIVI_SHEET_ID }}
          PYTHONIOENCODING: utf-8
          # Onglet de détail dans le fichier de suivi : seulement pour un lancement manuel.
          EVAL_ONGLET: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python scripts/evaluer_tri.py
