name: Préparation du jeu d'annotation (lot 2)

# Collecte réelle (aucun envoi), tirage d'environ 150 offres, création de l'onglet
# « Annotation » dans le fichier de suivi (jamais écrasé s'il existe), et conservation de
# l'échantillon complet sur la branche « sondes » pour l'évaluation.

on:
  push:
    branches: [lot2]
    paths: ['scripts/echantillon_annotation.py', '.github/workflows/annotation.yml']
  workflow_dispatch:

concurrency:
  group: annotation
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  echantillon:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8
      SONDE_DIR: ${{ github.workspace }}/annotation_out
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Collecte et onglet Annotation
        env:
          FT_CLIENT_ID: ${{ secrets.FT_CLIENT_ID }}
          FT_CLIENT_SECRET: ${{ secrets.FT_CLIENT_SECRET }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          SUIVI_SHEET_ID: ${{ secrets.SUIVI_SHEET_ID }}
        run: python scripts/echantillon_annotation.py
      - name: Conserve l'échantillon sur la branche sondes
        run: |
          set -e
          rm -f "$SONDE_DIR"/*.sqlite
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          DEST="$RUNNER_TEMP/sondes"
          git fetch --depth 1 origin sondes
          git worktree add "$DEST" FETCH_HEAD
          cd "$DEST" && git checkout -B sondes
          mkdir -p annotation && cp "$SONDE_DIR"/echantillon_annotation.json "annotation/echantillon_$(date -u +%Y-%m-%d).json"
          git add -A && git commit -qm "annotation : échantillon du $(date -u +%Y-%m-%d) (run ${{ github.run_id }})"
          git push -q origin sondes
