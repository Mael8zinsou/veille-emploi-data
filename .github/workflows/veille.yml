name: Veille emploi (v2)

# Un passage de la veille v2 toutes les heures. Le code décide, en heure de Paris, de ce qui
# est dû (config/planning.yaml) : rien ne se passe hors de la plage 7h-22h.
#
# Lancement principal : cron-job.org appelle workflow_dispatch toutes les heures (minute 5).
# Le cron ci-dessous n'est qu'un secours : GitHub retarde ses lancements programmés de plusieurs
# heures et en saute. La concurrence et le planning évitent tout double envoi.
#
# En service depuis la fusion de la PR « Mise en service ». Pour revenir en test :
# VEILLE_ENVOI=simulation et VEILLE_SUIVI=essai.

on:
  schedule:
    - cron: '17 5-21 * * *'
  workflow_dispatch:

# Deux passages simultanés se marcheraient sur la base.
concurrency:
  group: veille-emploi
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt

      # Base persistée entre passages par le cache GitHub (clé datée, restauration par
      # préfixe). Même préfixe qu'en v1 : la v2 reprend la base v1 et y ajoute ses tables.
      - name: Restaure la base
        uses: actions/cache/restore@v4
        with:
          path: data/
          key: veille-db-${{ github.run_id }}
          restore-keys: |
            veille-db-

      - name: Passage
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          FT_CLIENT_ID: ${{ secrets.FT_CLIENT_ID }}
          FT_CLIENT_SECRET: ${{ secrets.FT_CLIENT_SECRET }}
          LBA_API_KEY: ${{ secrets.LBA_API_KEY }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          SUIVI_SHEET_ID: ${{ secrets.SUIVI_SHEET_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          VEILLE_BASE: data/offres.sqlite
          VEILLE_ENVOI: telegram
          VEILLE_SUIVI: reel
          PYTHONIOENCODING: utf-8
        run: python -m src.main

      - name: Sauvegarde la base
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/
          key: veille-db-${{ github.run_id }}
