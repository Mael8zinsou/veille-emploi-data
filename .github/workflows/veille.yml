name: Veille emploi (v2)

# Un passage de la veille v2 toutes les heures. Le code décide, en heure de Paris, de ce qui
# est dû (config/planning.yaml) : rien ne se passe hors de la plage 7h-22h.
#
# PÉRIODE DE TEST (depuis le 26/10/2026) : aucun envoi Telegram (mode simulation, jeton non
# transmis) et, dans le fichier de suivi, écriture seulement dans les onglets « (essai) ».
# Mise en service réelle : VEILLE_ENVOI=telegram, VEILLE_SUIVI=reel et transmettre
# TELEGRAM_BOT_TOKEN, après le réglage des seuils sur l'annotation.

on:
  schedule:
    - cron: '17 5-21 * * *'
  workflow_dispatch:

# Deux passages simultanés se marcheraient sur la base.
concurrency:
  group: veille-emploi
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt

      # Base persistée entre passages par le cache GitHub (clé datée, restauration par
      # préfixe). Même préfixe qu'en v1 : la v2 reprend la base v1 et y ajoute ses tables.
      - name: Restaure la base
        uses: actions/cache/restore@v4
        with:
          path: data/
          key: veille-db-${{ github.run_id }}
          restore-keys: |
            veille-db-

      - name: Passage
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          FT_CLIENT_ID: ${{ secrets.FT_CLIENT_ID }}
          FT_CLIENT_SECRET: ${{ secrets.FT_CLIENT_SECRET }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          SUIVI_SHEET_ID: ${{ secrets.SUIVI_SHEET_ID }}
          VEILLE_BASE: data/offres.sqlite
          VEILLE_ENVOI: simulation
          VEILLE_SUIVI: essai
          PYTHONIOENCODING: utf-8
        run: python -m src.main

      - name: Sauvegarde la base
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/
          key: veille-db-${{ github.run_id }}
