name: Essai v2 (passage à blanc)

# Passage complet de la v2 sur les vraies sources, sans aucun envoi (le lot 1 n'envoie rien).
# La base de production v1 est restaurée en LECTURE : la v2 l'importe dans une copie jetable,
# ce qui teste la migration sur les vraies données. Le cache n'est jamais réécrit.

on:
  push:
    branches: [lot1, v2]
    paths: ['src/**', 'config/**', '.github/workflows/v2_essai.yml']
  workflow_dispatch:

concurrency:
  group: v2-essai
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  essai:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Restaure la base v1 (lecture seule)
        uses: actions/cache/restore@v4
        with:
          path: data/
          key: essai-v2-${{ github.run_id }}
          restore-keys: |
            veille-db-

      - name: Passage à blanc
        env:
          FT_CLIENT_ID: ${{ secrets.FT_CLIENT_ID }}
          FT_CLIENT_SECRET: ${{ secrets.FT_CLIENT_SECRET }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          VEILLE_BASE: data/offres.sqlite
          # Adzuna est exclue des essais pour ménager son quota (250 requêtes par mois) ;
          # elle est couverte par la comparaison v1 / v2.
          VEILLE_SOURCES: france_travail,hellowork
          PYTHONIOENCODING: utf-8
        run: |
          ls -la data/ || true
          python -m src.main
