name: Essai v2 (passage à blanc)

# Passage complet de la v2 sur les vraies sources, sans aucun envoi (mode simulation).
# La base de production v1 est restaurée en LECTURE : la v2 l'importe dans une copie jetable,
# ce qui teste la migration sur les vraies données. Le cache n'est jamais réécrit.

on:
  push:
    branches: [lot1, lot3, lot4, v2]
    paths: ['src/**', 'config/**', '.github/workflows/v2_essai.yml']
  workflow_dispatch:

concurrency:
  group: v2-essai
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  essai:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Restaure la base v1 (lecture seule)
        uses: actions/cache/restore@v4
        with:
          path: data/
          key: essai-v2-${{ github.run_id }}
          restore-keys: |
            veille-db-

      - name: Passage à blanc
        env:
          FT_CLIENT_ID: ${{ secrets.FT_CLIENT_ID }}
          FT_CLIENT_SECRET: ${{ secrets.FT_CLIENT_SECRET }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          VEILLE_BASE: data/offres.sqlite
          # Comme le mode ombre : planning réel, Adzuna exclue (quota partagé avec la v1),
          # envois simulés (aucun jeton Telegram transmis).
          VEILLE_SOURCES_EXCLUES: adzuna
          # Pour essayer une seule source : VEILLE_SOURCES: <nom> (essai du lot 5 : service_public).
          VEILLE_ENVOI: simulation
          # Fichier de suivi non touché (la production écrit dans l'onglet Veille).
          VEILLE_SUIVI: aucun
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          SUIVI_SHEET_ID: ${{ secrets.SUIVI_SHEET_ID }}
          PYTHONIOENCODING: utf-8
        run: |
          ls -la data/ || true
          python -m src.main
