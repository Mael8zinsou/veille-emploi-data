name: Veille v2 en ombre (sans envoi)

# Fait tourner la v2 (code de la branche « v2 ») toutes les heures, en parallèle de la v1,
# SANS AUCUN ENVOI : le jeton Telegram n'est pas transmis et le mode est « simulation ».
# La base v2 a son propre cache (veille-v2-db-) ; au premier passage, elle part de la base
# v1 (lecture seule) pour ne pas tout considérer comme nouveau. Adzuna est coupée : son
# quota est partagé avec la v1. À supprimer à la bascule (la v2 reprendra veille.yml).

on:
  schedule:
    - cron: '17 5-21 * * *'
  workflow_dispatch:

concurrency:
  group: veille-v2-ombre
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ombre:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Restaure la base v2 (ou la base v1 au premier passage)
        uses: actions/cache/restore@v4
        with:
          path: data/
          key: veille-v2-db-${{ github.run_id }}
          restore-keys: |
            veille-v2-db-
            veille-db-

      - name: Passage v2 (simulation)
        env:
          FT_CLIENT_ID: ${{ secrets.FT_CLIENT_ID }}
          FT_CLIENT_SECRET: ${{ secrets.FT_CLIENT_SECRET }}
          VEILLE_BASE: data/offres.sqlite
          VEILLE_ENVOI: simulation
          VEILLE_SOURCES_EXCLUES: adzuna
          PYTHONIOENCODING: utf-8
        run: python -m src.main

      - name: Sauvegarde la base v2
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/
          key: veille-v2-db-${{ github.run_id }}
