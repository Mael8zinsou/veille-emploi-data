<html><head><script type="application/ld+json">
    {"@context":"https:\/\/schema.org\/","@type":"JobPosting","title":"Data scientist sur les atteintes aux biens","addressLocality":"Paris (75), France","jobLocation":{"@type":"Place","address":{"@type":"PostalAddress","streetAddress":"Paris (75), France","addressLocality":"Paris (75), France","addressRegion":"\u00cele-de-France","addressCountry":"France","postalCode":"Paris (75)"}},"hiringOrganization":"Service Statistique Minist\u00e9riel de la s\u00e9curit\u00e9 Int\u00e9rieure ","baseSalary":"Non renseign\u00e9","experienceRequirements":"Confirm\u00e9","Description":"\nRIFSEEP : 2Le titulaire du poste r\u00e9alise des travaux d\u2019analyses quantitatives sur les th\u00e9matiques des atteintes aux biens et des atteintes environnementales. Le titulaire du poste r\u00e9dige des notes, des dossiers de synth\u00e8se ainsi que des \u00e9tudes pour alimenter notamment les publications du SSMSI. Il peut \u00eatre amen\u00e9 \u00e0 produire des \u00e9valuations des politiques publiques. Il vise \u00e0 int\u00e9grer dans ses analyses la dimension territoriale et \u00e0 produire des comparaisons internationales.La production de ces travaux d\u2019analyse s\u2019appuie sur l\u2019exploitation de donn\u00e9es administratives sur les infractions, les victimes et les mis en cause enregistr\u00e9s par les services de police et de gendarmerie nationales, les signalements recueillis sur les plateformes d\u00e9di\u00e9es et les enqu\u00eates de victimation.Il r\u00e9alise \u00e9galement des travaux d\u2019investissement afin de produire les statistiques et les analyses les plus compl\u00e8tes et les plus fiables sur le sujet. Il a des \u00e9changes avec de nombreux interlocuteurs en interne au minist\u00e8re de l\u2019Int\u00e9rieur et dans d\u2019autres administrations.Il est plus sp\u00e9cifiquement en charge des concepts et des \u00e9tudes sur la th\u00e9matique des atteintes aux biens : cambriolages, vols avec ou sans violence, vols de v\u00e9hicules (4 roues, 2 roues, v\u00e9los,..), mais aussi trafic et d\u00e9tention prohib\u00e9e d\u2019armes \u00e0 feu et trafic de biens culturels en collaboration avec la section qui traite de la criminalit\u00e9 organis\u00e9e. Les atteintes environnementales, y compris atteintes aux animaux, sujet central dans le contexte de la construction de la statistique europ\u00e9enne, font actuellement l\u2019objet d\u2019investissements m\u00e9thodologiques et devraient donner lieu \u00e0 de nouvelles publications dans le courant 2027.Activit\u00e9s du serviceLe SSMSI, cr\u00e9\u00e9 fin 2014 au sein du minist\u00e8re de l\u2019Int\u00e9rieur, a comme missions de produire et de diffuser des statistiques publiques dans le domaine de la d\u00e9linquance et de l\u2019ins\u00e9curit\u00e9, de mobiliser des donn\u00e9es statistiques, des enqu\u00eates (de victimation notamment), des \u00e9tudes et des analyses pour piloter, \u00e9clairer et \u00e9valuer les politiques publiques de s\u00e9curit\u00e9 et d\u2019assister les administrations de la police et de la gendarmerie dans l\u2019accomplissement de leurs missions, le tout dans un contexte o\u00f9 son p\u00e9rim\u00e8tre et ses activit\u00e9s s\u2019\u00e9largissent.\u00a0Composition et effectifs du serviceLe SSMSI comprend actuellement 60 agents permanents, r\u00e9partis en cinq bureaux\u00a0: statisticiens des corps de l\u2019Insee, policiers et gendarmes, contractuels et agents des corps administratifs et techniques du minist\u00e8re de l\u2019Int\u00e9rieur.Liaisons hi\u00e9rarchiquesVotre N+1 est le chef de la section \u00ab\u00a0Atteintes aux biens\u00a0\u00bb au sein du bureau des \u00e9tudes th\u00e9matiques sur la d\u00e9linquance et la victimation (BETDV).Liaisons fonctionnellesVous \u00eates en relations directes avec\u00a0:Les charg\u00e9s d\u2019\u00e9tudes du bureau et plus largement du SSMSI,Des offices centraux et des unit\u00e9s sp\u00e9cialis\u00e9es du Minist\u00e8re de l\u2019int\u00e9rieur,Des interlocuteurs externes (autres minist\u00e8res, chercheurs).\n","skills":"","datePosted":"06\/11\/2026","industry":"Num\u00e9rique","educationRequirements":""}</script></head><body><div class="fr-col-12 buttons-wrapper">
